{% extends "base.html" %}
{% block title %}New user{% endblock %}
{% block content %}
<h1>New user</h1>
{% include "_errors.html" %}
<form class="card form narrow" method="post">
  <label>Username *<input name="username" value="{{ username }}" required autocomplete="off"></label>
  <label>Full name *<input name="full_name" value="{{ full_name }}" required></label>
  <label>Role *
    <select name="role_id" required>
      <option value="">-- choose --</option>
      {% for role in roles %}
        <option value="{{ role.id }}" {% if role_id == role.id|string %}selected{% endif %}>{{ role.display_name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Password * <small class="muted">(at least 8 characters)</small>
    <input name="password" type="password" autocomplete="new-password" required minlength="8">
  </label>
  <div class="form-buttons">
    <button class="button primary" type="submit">Save</button>
    <a href="{{ url_for('user_list') }}">Cancel</a>
  </div>
</form>
{% endblock %}
